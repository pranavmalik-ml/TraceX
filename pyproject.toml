[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracex-fraud-tracing"
version = "0.1.0"
description = "Research prototype for explainable multi-hop transaction tracing and proportional taint attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8,<3.0",
  "networkx>=3.2,<4.0",
  "pandas>=2.0,<4.0",
  "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools]
py-modules = ["taint_propagator", "taint_propagator_v2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "graph_engine*", "investigation_engine*", "risk_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests", "risk_engine/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
